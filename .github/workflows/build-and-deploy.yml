name: Bygg og deploy

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: Cluster
        required: true
        default: dev-gcp
        type: choice
        options:
          - dev-gcp
          - prod-gcp
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  buildDev:
    uses: navikt/aap-workflows/.github/workflows/frontend-next-build.yml@main
    permissions:
      contents: read
      id-token: write
      packages: write
    secrets: inherit
    with:
      cluster: dev-gcp
      appname: 'aap-paw-patrol'
      playwright: false
      cdn: true

  buildProd:
    if: ${{ github.ref == 'refs/heads/main' || github.event.inputs.cluster == 'prod-gcp' }}
    uses: navikt/aap-workflows/.github/workflows/frontend-next-build.yml@main
    permissions:
      contents: read
      id-token: write
      packages: write
    secrets: inherit
    with:
      cluster: prod-gcp
      appname: 'aap-paw-patrol'
      playwright: false
      cdn: true

  deployDev:
    needs: buildDev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: nais/setup@v1
        with:
          team: aap
      - run: |
          nais apply .nais/dev-gcp.yaml \
            --environment dev-gcp \
            --set spec.image="${{ needs.buildDev.outputs.image }}" \
            --wait

  deployProd:
    needs: [ buildProd, deployDev ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: nais/setup@v1
        with:
          team: aap
      - run: |
          nais apply .nais/prod-gcp.yaml \
            --environment prod-gcp \
            --set spec.image="${{ needs.buildProd.outputs.image }}" \
            --wait
